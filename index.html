<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eisen-Kohlenstoff-Phasendiagramm</title>
    <!-- Externe Bibliotheken für Styling und Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.js"></script>
    <style>
        :root {
            --primary: #0b57d0;
            --on-primary: #fff;
            --surface: #fff;
            --surface-container: #f0f4f9;
            --outline: #747775;
            --outline-variant: #c4c7c5;
            --chart-1: #1558d6; /* Schmelze / Liquidus */
            --chart-2: #046e00; /* Austenit / Solidus */
            --chart-3: #eaa937; /* Ferrit / Perlit */
            --chart-4: #c0151d; /* Zementit */
            --chart-5: #a56eff; /* Mischgebiete */
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #a8c7fa;
                --on-primary: #062e6f;
                --surface: #101218;
                --surface-container: #282a2c;
                --outline: #9a9b9c;
                --outline-variant: #4a5050;
            }
        }
    </style>
    <script>
        window['CALLER_ID'] = 'spark';
    </script>
</head>
<body class="spark-widget-shell">

<script>
// Initialisieren der App mit interaktiven Parametern für Kohlenstoffgehalt und Temperatur
const { state } = WH.createApp({
    title: "Eisen-Kohlenstoff-Phasendiagramm",
    params: {
        preset: {
            label: "Stahl-/Gusseisen-Typ",
            type: "select",
            value: "Frei wählbar",
            options: [
                { label: "Frei wählbar", value: "custom" },
                { label: "Reines Eisen (0.0% C)", value: "pure" },
                { label: "Baustahl / S235 (0.17% C)", value: "s235" },
                { label: "Schienenstahl (0.7% C)", value: "rail" },
                { label: "Werkzeugstahl C100 (1.0% C)", value: "c100" },
                { label: "Gusseisen (eutektisch, 4.3% C)", value: "cast_eut" }
            ],
            key: "preset"
        },
        compC: {
            label: "Kohlenstoffgehalt (M.-%)",
            type: "slider",
            min: 0,
            max: 6.67,
            step: 0.01,
            value: 1.0,
            key: "compC"
        },
        temp: {
            label: "Temperatur (°C)",
            type: "slider",
            min: 500,
            max: 1600,
            step: 5,
            value: 1000,
            key: "temp"
        }
    },
    internal_state: {
        phaseState: "Austenit (γ)",
        microstructure: "Homogener Austenit",
        leverRuleInfo: "Einfasiges Gebiet (100% Austenit)"
    },
    sizing: { viz: { height: 450 } },
    editorial: {
        hud: [
            { label: "Temperatur", value: "1000 °C" },
            { label: "C-Anteil", value: "1.00 M.-%" },
            { label: "Phase(n)", value: "Austenit (γ)" },
            { label: "Gefüge", value: "Homogener Austenit" },
            { label: "Mengenanteile (Hebelgesetz)", value: "100% γ" }
        ]
    }
});

// Presets binden, um Schieberegler automatisch einzustellen
state._subscribe('preset', (val) => {
    if (val === 'pure') { state.compC = 0.0; }
    else if (val === 's235') { state.compC = 0.17; }
    else if (val === 'rail') { state.compC = 0.70; }
    else if (val === 'c100') { state.compC = 1.00; }
    else if (val === 'cast_eut') { state.compC = 4.30; }
});

// Reagieren auf Änderungen des Zustands, um das HUD zu aktualisieren
state._subscribe('phaseState', () => {
    ui.setEditorial({
        hud: [
            { label: "Temperatur", value: `${Math.round(state.temp)} °C` },
            { label: "C-Anteil", value: `${state.compC.toFixed(2)} M.-%` },
            { label: "Phase(n)", value: state.phaseState },
            { label: "Gefüge", value: state.microstructure },
            { label: "Mengenanteile", value: state.leverRuleInfo }
        ]
    });
});
</script>

<script>
WH.initCanvas('viz', ({ ctx, width, height, state }) => {
    // Grenzen des Diagramms
    const C_MIN = 0;
    const C_MAX = 6.67; // Maximaler Kohlenstoffgehalt für Fe3C
    const T_MIN = 500;
    const T_MAX = 1600;

    const margin = { top: 40, right: 80, bottom: 50, left: 70 };

    return ({ ctx, width, height, time, dt, pointer, frameCount }) => {
        const plotW = width - margin.left - margin.right;
        const plotH = height - margin.top - margin.bottom;

        // --- Mappings (Daten-Raum in Pixel-Raum) ---
        const toX = (c) => margin.left + (c / C_MAX) * plotW;
        const toY = (t) => margin.top + (1 - (t - T_MIN) / (T_MAX - T_MIN)) * plotH;
        const fromX = (px) => WH.clamp(((px - margin.left) / plotW) * C_MAX, C_MIN, C_MAX);
        const fromY = (py) => WH.clamp(T_MIN + (1 - (py - margin.top) / plotH) * (T_MAX - T_MIN), T_MIN, T_MAX);

        // --- Mathematische Modellierung der Phasenlinien ---
        
        // Liquidus-Temperatur
        const getLiquidus = (x) => {
            if (x < 0.53) {
                return 1538 - (1538 - 1493) * (x / 0.53); // A -> B (Peritektikum)
            } else if (x < 4.3) {
                // B (0.53, 1493) -> C (4.3, 1147)
                const t = (x - 0.53) / (4.3 - 0.53);
                return 1493 - 346 * Math.pow(t, 1.3);
            } else {
                // C (4.3, 1147) -> D (6.67, 1227)
                const t = (x - 4.3) / (6.67 - 4.3);
                return 1147 + 80 * Math.pow(t, 1.1);
            }
        };

        // Solidus-Temperatur
        const getSolidus = (x) => {
            if (x < 0.09) {
                return 1538 - (1538 - 1493) * (x / 0.09); // A -> H
            } else if (x < 0.17) {
                return 1493; // H -> I Peritektikale
            } else if (x < 2.06) {
                // I (0.17, 1493) -> E (2.06, 1147)
                const t = (x - 0.17) / (2.06 - 0.17);
                return 1493 - 346 * Math.pow(t, 1.5);
            } else {
                return 1147; // Eutektikale E -> C -> F
            }
        };

        // A3-Linie (GS) - Umwandlung Austenit/Ferrit
        const getA3 = (x) => {
            if (x > 0.76) return 727;
            const t = x / 0.76;
            return 911 - (911 - 727) * Math.pow(t, 0.8);
        };

        // Acm-Linie (ES) - Löslichkeitsgrenze für Kohlenstoff in Austenit
        const getAcm = (x) => {
            if (x < 0.76 || x > 2.06) return 727;
            const t = (x - 0.76) / (2.06 - 0.76);
            return 727 + (1147 - 727) * Math.pow(t, 0.7);
        };

        // Löslichkeitslinie Ferrit (GP)
        const getGP = (x) => {
            if (x > 0.022) return 727;
            return 911 - (911 - 727) * (x / 0.022);
        };

        // Maximale Löslichkeit im Ferrit (PQ)
        const getPQ = (t) => {
            if (t > 727) return 0.022;
            const factor = (t - 500) / (727 - 500);
            return 0.0008 + (0.022 - 0.0008) * Math.max(0, factor);
        };

        // --- Raster und Achsen zeichnen ---
        ctx.strokeStyle = WH.getColor('--outline-variant');
        ctx.lineWidth = 1;
        ctx.beginPath();
        
        // Temperaturgitter
        for (let t = T_MIN; t <= T_MAX; t += 100) {
            const y = toY(t);
            ctx.moveTo(margin.left, y);
            ctx.lineTo(margin.left + plotW, y);
            ctx.fillStyle = WH.getColor('--on-surface-de-emphasis');
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.font = '10px sans-serif';
            ctx.fillText(`${t}°C`, margin.left - 8, y);
        }

        // Kohlenstoffgehalt-Gitter
        for (let c = 0; c <= 6; c += 1) {
            const x = toX(c);
            ctx.moveTo(x, margin.top);
            ctx.lineTo(x, margin.top + plotH);
            ctx.fillStyle = WH.getColor('--on-surface-de-emphasis');
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(`${c}%`, x, margin.top + plotH + 8);
        }
        // Spezifischer cementite-Endpunkt
        ctx.moveTo(toX(6.67), margin.top);
        ctx.lineTo(toX(6.67), margin.top + plotH);
        ctx.fillText(`6.67%`, toX(6.67), margin.top + plotH + 8);
        ctx.stroke();

        // --- Diagramm-Kurven zeichnen ---
        const drawBoundary = (func, minC, maxC, color, label) => {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            const steps = 100;
            for (let i = 0; i <= steps; i++) {
                const c = minC + (i / steps) * (maxC - minC);
                const t = func(c);
                if (i === 0) ctx.moveTo(toX(c), toY(t));
                else ctx.lineTo(toX(c), toY(t));
            }
            ctx.stroke();
        };

        // Liquidus (Blau)
        drawBoundary(getLiquidus, 0, 6.67, WH.getColor('--chart-1'), 'Liquidus');
        // Solidus (Grün)
        drawBoundary(getSolidus, 0, 6.67, WH.getColor('--chart-2'), 'Solidus');
        // A3 (G-S)
        drawBoundary(getA3, 0, 0.76, WH.getColor('--chart-3'), 'A3');
        // Acm (E-S)
        drawBoundary(getAcm, 0.76, 2.06, WH.getColor('--chart-4'), 'Acm');
        // GP
        drawBoundary(getGP, 0, 0.022, WH.getColor('--chart-5'), 'GP');

        // Isotherme Linien zeichnen (Eutektikale & Eutektoidale)
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = WH.getColor('--outline');
        
        // Eutektikale (1147 °C)
        ctx.beginPath();
        ctx.moveTo(toX(2.06), toY(1147));
        ctx.lineTo(toX(6.67), toY(1147));
        ctx.stroke();
        ctx.fillStyle = WH.getColor('--on-surface-de-emphasis');
        ctx.font = '10px sans-serif';
        ctx.fillText("1147 °C (Eutektikale)", toX(4.3), toY(1147) - 6);

        // Eutektoidale (727 °C)
        ctx.beginPath();
        ctx.moveTo(toX(0.022), toY(727));
        ctx.lineTo(toX(6.67), toY(727));
        ctx.stroke();
        ctx.fillText("727 °C (Eutektoidale)", toX(3.5), toY(727) - 6);

        // --- Interaktive Abfrage und Hebelgesetz ---
        // Verknüpfung mit Schiebereglern oder Mauszeiger
        let currentC = state.compC;
        let currentT = state.temp;

        // Wenn der Nutzer mit der Maus über das Canvas fährt, überschreiben wir die Werte temporär
        if (pointer.x > margin.left && pointer.x < width - margin.right &&
            pointer.y > margin.top && pointer.y < height - margin.bottom) {
            currentC = fromX(pointer.x);
            currentT = fromY(pointer.y);
            
            // Werte zurück in den State spiegeln, damit die Schieberegler synchron bleiben
            if (frameCount % 3 === 0) {
                state.compC = currentC;
                state.temp = currentT;
                state.preset = 'custom'; // Auf "Frei wählbar" setzen bei manueller Interaktion
            }
        }

        const tLiq = getLiquidus(currentC);
        const tSol = getSolidus(currentC);

        let phase = "Schmelze";
        let structure = "Flüssige Phase";
        let leverRule = "Einfasiges Gebiet (100% Schmelze)";
        let tieL = null, tieR = null;

        // Phasengebiets-Klassifizierung und Konnoden-Berechnung
        if (currentT > tLiq) {
            phase = "Schmelze (L)";
            structure = "Homogene Schmelze";
            leverRule = "100% flüssig";
        } else if (currentT > tSol) {
            // Zweiphasengebiet: Schmelze + Feststoff
            phase = "Schmelze + Mischkristalle";
            
            // Bestimmung der Ränder für Konnode
            // Flüssig-Grenze (Liquidus)
            let xL = 0;
            if (currentT >= 1493) {
                xL = 0.53 * (1538 - currentT) / (1538 - 1493);
            } else {
                // Invertiere Liquidus: 1493 - 346 * Math.pow((x - 0.53) / 3.77, 1.3) = T
                const diff = (1493 - currentT) / 346;
                xL = 0.53 + 3.77 * Math.pow(diff, 1 / 1.3);
            }

            // Fest-Grenze (Solidus)
            let xS = 0;
            if (currentT >= 1493) {
                xS = 0.09 * (1538 - currentT) / (1538 - 1493);
            } else {
                // Invertiere Solidus: 1493 - 346 * Math.pow((x - 0.17) / 1.89, 1.5) = T
                const diff = (1493 - currentT) / 346;
                xS = 0.17 + 1.89 * Math.pow(diff, 1 / 1.5);
            }

            // Falls außerhalb des logischen Bereichs, absichern
            xL = WH.clamp(xL, 0, 6.67);
            xS = WH.clamp(xS, 0, 2.06);

            if (currentC >= xS && currentC <= xL) {
                const fractionL = ((currentC - xS) / (xL - xS)) * 100;
                const fractionS = 100 - fractionL;
                phase = "Schmelze + Austenit (γ)";
                structure = "Erstarrende Legierung (Dendritenbildung)";
                leverRule = `${fractionL.toFixed(1)}% Schmelze, ${fractionS.toFixed(1)}% Austenit`;
                tieL = xS;
                tieR = xL;
            } else if (currentC > xL) {
                // Rechts der Schmelzlinie (Schmelze + Zementit)
                const xZem = 6.67;
                const fractionL = ((xZem - currentC) / (xZem - xL)) * 100;
                const fractionZ = 100 - fractionL;
                phase = "Schmelze + Primärzementit (Fe₃C)";
                structure = "Zementitnadeln in Schmelze";
                leverRule = `${fractionL.toFixed(1)}% Schmelze, ${fractionZ.toFixed(1)}% Fe₃C`;
                tieL = xL;
                tieR = xZem;
            }
        } else {
            // Vollständig erstarrter Zustand (Solidus unterschritten)
            if (currentT > 727) {
                const tA3 = getA3(currentC);
                const tAcm = getAcm(currentC);

                if (currentC < 0.022) {
                    phase = "Ferrit (α)";
                    structure = "Reiner Ferrit";
                    leverRule = "100% α-Mischkristall";
                } else if (currentC < tA3) {
                    // Zweiphasengebiet Ferrit + Austenit
                    // Invertiere GP
                    const xAlpha = 0.022 * (911 - currentT) / (911 - 727);
                    // Invertiere GS (A3)
                    const xGamma = 0.76 * Math.pow((911 - currentT) / (911 - 727), 1 / 0.8);
                    
                    const fractionA = ((xGamma - currentC) / (xGamma - xAlpha)) * 100;
                    const fractionG = 100 - fractionA;
                    
                    phase = "Austenit (γ) + Ferrit (α)";
                    structure = "Untererutektoider Stahl im Umwandlungsbereich";
                    leverRule = `${fractionA.toFixed(1)}% Ferrit (α), ${fractionG.toFixed(1)}% Austenit (γ)`;
                    tieL = xAlpha;
                    tieR = xGamma;
                } else if (currentC <= tAcm) {
                    // Reines Austenitgebiet
                    phase = "Austenit (γ)";
                    structure = "Homogenes austenitisches Gefüge";
                    leverRule = "100% γ-Mischkristall (Warmarbeitsgefüge)";
                } else {
                    // Austenit + Sekundärzementit
                    // Ränder bestimmen
                    let xGamma = 0.76;
                    // Invertiere ES (Acm)
                    const diff = (currentT - 727) / (1147 - 727);
                    xGamma = 0.76 + (2.06 - 0.76) * Math.pow(diff, 1 / 0.7);
                    const xZem = 6.67;

                    const fractionG = ((xZem - currentC) / (xZem - xGamma)) * 100;
                    const fractionZ = 100 - fractionG;

                    phase = "Austenit (γ) + Sekundärzementit (Fe₃C)";
                    structure = "Übereutektoider Stahl (Zementitnetzwerke an Korngrenzen)";
                    leverRule = `${fractionG.toFixed(1)}% Austenit (γ), ${fractionZ.toFixed(1)}% Fe₃C`;
                    tieL = xGamma;
                    tieR = xZem;
                }
            } else {
                // Temperaturen unterhalb 727 °C
                const xAlpha = getPQ(currentT);
                const xZem = 6.67;

                if (currentC < xAlpha) {
                    phase = "Ferrit (α)";
                    structure = "Übersättigter Ferrit";
                    leverRule = "100% Ferrit (α)";
                } else {
                    // Hebelgesetz zwischen Ferrit und Zementit
                    const fractionA = ((xZem - currentC) / (xZem - xAlpha)) * 100;
                    const fractionZ = 100 - fractionA;

                    tieL = xAlpha;
                    tieR = xZem;

                    if (currentC < 0.76) {
                        phase = "Ferrit (α) + Zementit (Fe₃C)";
                        structure = "Perlit + freier Ferrit (Unterteilter Baustahl)";
                        leverRule = `${fractionA.toFixed(1)}% Ferrit, ${fractionZ.toFixed(1)}% Fe₃C (Perlitanteil: ${((currentC / 0.76)*100).toFixed(1)}%)`;
                    } else if (currentC === 0.76) {
                        phase = "Perlit (α + Fe₃C)";
                        structure = "Reines lamellares Perlitgefüge";
                        leverRule = `${fractionA.toFixed(1)}% Ferrit, ${fractionZ.toFixed(1)}% Fe₃C (100% Perlit)`;
                    } else if (currentC < 2.06) {
                        phase = "Perlit + Sekundärzementit";
                        structure = "Perlitkörner mit Korngrenzenzementit";
                        leverRule = `${fractionA.toFixed(1)}% Ferrit, ${fractionZ.toFixed(1)}% Fe₃C`;
                    } else {
                        phase = "Perlit + Ledeburit + Zementit";
                        structure = "Weißes Gusseisen (Hartguss)";
                        leverRule = `${fractionA.toFixed(1)}% Ferrit, ${fractionZ.toFixed(1)}% Fe₃C (Ledeburit-Matrix)`;
                    }
                }
            }
        }

        // Zeichne Hebelgesetz-Konnode (Tie-Line) falls vorhanden
        if (tieL !== null && tieR !== null) {
            ctx.lineWidth = 3;
            ctx.strokeStyle = WH.getColor('--outline');
            ctx.beginPath();
            ctx.moveTo(toX(tieL), toY(currentT));
            ctx.lineTo(toX(tieR), toY(currentT));
            ctx.stroke();

            // Linker und rechter Hebelpunkt
            ctx.fillStyle = WH.getColor('--chart-3');
            ctx.beginPath();
            ctx.arc(toX(tieL), toY(currentT), 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = WH.getColor('--chart-4');
            ctx.beginPath();
            ctx.arc(toX(tieR), toY(currentT), 5, 0, Math.PI * 2);
            ctx.fill();

            // Labels für Ränder anheften
            ctx.drawTag(toX(tieL), toY(currentT) - 15, `Links: ${tieL.toFixed(3)}%`, '--chart-3');
            ctx.drawTag(toX(tieR), toY(currentT) - 15, `Rechts: ${tieR.toFixed(2)}%`, '--chart-4');
        }

        // Fadenkreuz für die aktuelle Cursor-/Schiebereglerposition zeichnen
        const pX = toX(currentC);
        const pY = toY(currentT);

        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = WH.getColor('--outline');
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pX, margin.top);
        ctx.lineTo(pX, margin.top + plotH);
        ctx.moveTo(margin.left, pY);
        ctx.lineTo(margin.left + plotW, pY);
        ctx.stroke();
        ctx.setLineDash([]);

        // Zentraler Zeigerkreis
        ctx.fillStyle = WH.getColor('--primary');
        ctx.beginPath();
        ctx.arc(pX, pY, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // --- Achsenbeschriftungen ---
        ctx.fillStyle = WH.getColor('--on-surface-default');
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Kohlenstoffgehalt C (Masse-%)', margin.left + plotW / 2, margin.top + plotH + 35);
        
        ctx.save();
        ctx.translate(margin.left - 45, margin.top + plotH / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText('Temperatur T (°C)', 0, 0);
        ctx.restore();

        // Phasenbezeichnungen im Diagramm als statische Orientierungspunkte zeichnen
        ctx.fillStyle = WH.getColor('--on-surface-de-emphasis');
        ctx.font = 'italic 11px sans-serif';
        ctx.fillText("Schmelze (L)", toX(4.5), toY(1450));
        ctx.fillText("Austenit (γ)", toX(1.2), toY(950));
        ctx.fillText("α + γ", toX(0.4), toY(800));
        ctx.fillText("α", toX(0.015), toY(760));
        ctx.fillText("γ + Fe₃C", toX(3.5), toY(950));
        ctx.fillText("Perlit + Fe₃C (L+S)", toX(3.0), toY(600));

        // State an die App zurückgeben für das reaktive HUD
        if (frameCount % 4 === 0) {
            state.phaseState = phase;
            state.microstructure = structure;
            state.leverRuleInfo = leverRule;
        }
    };
}, { height: 450 });
</script>

</body>
</html>
